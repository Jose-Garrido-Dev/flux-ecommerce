# Entorno de DESARROLLO local. Producción: compose.prod.yml (ver docs/INSTALACION.md)
name: flux

x-php: &php
  build:
    context: .
    dockerfile: infra/docker/php/Dockerfile
    target: base
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: flux-backend-dev
  volumes:
    - ./backend:/var/www/backend
  environment:
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
  depends_on:
    postgres:
      condition: service_healthy
  user: www-data

services:
  app:
    <<: *php
    restart: unless-stopped

  worker:
    <<: *php
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600
    restart: unless-stopped

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  storefront:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "${STOREFRONT_PORT:-3000}:3000"
    volumes:
      - ./storefront:/app
    environment:
      FLUX_API_INTERNAL_URL: http://nginx
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Solo desarrollo: igual a FLUX_REVALIDATE_SECRET de backend/.env.docker.example
      REVALIDATE_SECRET: cambiar-en-cada-instalacion
    depends_on:
      - nginx

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flux
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux -d flux"]
      interval: 5s
      retries: 10

  # OPCIONAL: solo se levanta con --profile redis (ver docs/INSTALACION.md, sección 8.2)
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # OPCIONAL: solo se levanta con --profile search
  meilisearch:
    image: getmeili/meilisearch:v1.11
    profiles: ["search"]
    environment:
      MEILI_MASTER_KEY: masterKeySoloDesarrollo
      MEILI_ENV: development
    ports:
      - "${MEILI_FORWARD_PORT:-7700}:7700"
    volumes:
      - meilidata:/meili_data

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
  meilidata:
