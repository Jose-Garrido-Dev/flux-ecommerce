# Nginx sirve el backend Laravel (API, webhooks y panel /admin)
server {
    listen 80;
    server_name _;
    root /var/www/backend/public;
    index index.php;
    client_max_body_size 25M;

    # DNS interno de Docker: si el contenedor "app" se recrea (cada despliegue) cambia de IP.
    # Con una variable, Nginx vuelve a resolver el nombre en vez de quedarse con la IP antigua.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
