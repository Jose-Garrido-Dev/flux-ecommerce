openapi: 3.1.0
info:
  title: Flux Storefront API
  version: 0.10.0
  description: >
    Contrato entre el backend Laravel y el storefront Next.js.
    Todo endpoint nuevo se agrega aquí antes de implementarse.
servers:
  - url: http://localhost:8000/api
paths:
  /health:
    get:
      summary: Liveness del backend
      responses:
        "200":
          description: El proceso responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
  /health/ready:
    get:
      summary: Readiness (base de datos, caché, scheduler y worker)
      responses:
        "200":
          description: Listo (ok) o degradado (scheduler sin latido)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Falla base de datos o caché
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /storefront/v1/store:
    get:
      summary: Datos públicos de la tienda
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PublicStore" }
        "429":
          description: Límite de solicitudes excedido
  /storefront/v1/home:
    get:
      summary: Bloques fijos de la portada (categorías destacadas, destacados, recién llegados, marcas)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      categories: { type: array, items: { $ref: "#/components/schemas/CategoryCard" } }
                      featured: { type: array, items: { $ref: "#/components/schemas/ProductCard" } }
                      newest: { type: array, items: { $ref: "#/components/schemas/ProductCard" } }
                      on_sale: { type: array, items: { $ref: "#/components/schemas/ProductCard" }, description: Productos con una oferta vigente }
                      brands: { type: array, items: { $ref: "#/components/schemas/BrandCard" } }
                      page:
                        description: Portada publicada en el panel (Fase 9). null = la tienda usa la portada fija
                        oneOf:
                          - $ref: "#/components/schemas/CmsPage"
                          - type: "null"
  /storefront/v1/menus:
    get:
      summary: Menús del encabezado y del pie
      description: Los enlaces a categorías, marcas o páginas que no están visibles se omiten. El encabezado admite un nivel de submenú.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      header: { type: array, items: { $ref: "#/components/schemas/MenuLink" } }
                      footer: { type: array, items: { $ref: "#/components/schemas/MenuLink" } }
  /storefront/v1/pages/{slug}:
    get:
      summary: Página publicada (landing o institucional)
      description: La portada no se sirve por esta ruta; viene en /home.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,160}$" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CmsPage" }
        "404":
          description: No existe o no está publicada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /storefront/v1/preview/{token}:
    get:
      summary: Vista previa de una versión en borrador
      description: El token lo genera el panel, va firmado con la clave de la aplicación y vence en 2 horas. Respuesta con Cache-Control no-store. Límite de 30 solicitudes por minuto.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/CmsPage"
                      - type: object
                        properties:
                          preview: { type: boolean, const: true }
        "404":
          description: Token inválido, alterado o vencido
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /storefront/v1/catalog/products:
    get:
      summary: Listado de productos publicados con filtros, orden y facetas
      parameters:
        - { name: category, in: query, schema: { type: string }, description: Slug; incluye subcategorías }
        - { name: brand, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Busca en nombre, descripción corta, marca y SKU }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, newest, price_asc, price_desc, name] } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: on_sale, in: query, schema: { type: boolean }, description: Solo productos con una oferta vigente }
        - { name: in_stock, in: query, schema: { type: boolean }, description: "Solo productos con al menos una variante comprable (con stock, sin control de stock o con sobreventa)" }
        - { name: min_price, in: query, schema: { type: integer, minimum: 0 }, description: Precio vigente con IVA, en CLP }
        - { name: max_price, in: query, schema: { type: integer, minimum: 0 } }
        - name: filter
          in: query
          style: deepObject
          schema: { type: object, additionalProperties: { type: string } }
          description: "filter[color]=negro,blanco. O dentro de un atributo, Y entre atributos. Códigos que no son atributos filtrables se ignoran."
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 24 } }
        - { name: facets, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
        "404":
          description: La categoría o marca no existe o no está publicada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Parámetros inválidos
  /storefront/v1/catalog/products/{slug}:
    get:
      summary: Ficha de producto publicado y productos relacionados
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ProductDetail" }
                  related: { type: array, description: "Primero los elegidos en el panel, luego de la misma categoría (máx. 8)", items: { $ref: "#/components/schemas/ProductCard" } }
        "404":
          description: No existe o no está publicado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /storefront/v1/catalog/categories:
    get:
      summary: Árbol de categorías del menú
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CategoryNode" } }
  /storefront/v1/catalog/categories/{slug}:
    get:
      summary: Categoría con migas de pan y subcategorías
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "404":
          description: No existe, está oculta o alguna categoría superior está oculta
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /storefront/v1/catalog/brands:
    get:
      summary: Marcas activas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/BrandCard" } }
  /storefront/v1/catalog/brands/{slug}:
    get:
      summary: Marca activa
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "404":
          description: No existe o no está activa
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  # ---------- Fase 5: carrito, checkout, pedidos y cuentas ----------
  # El navegador no llama estas rutas directamente: pasa por el puente /api/tienda de Next.js,
  # que guarda los tokens en cookies httpOnly y los reenvía como X-Cart-Token y Authorization.
  /storefront/v1/geo/regions:
    get:
      summary: Regiones habilitadas y sus comunas (vacío hasta cargar el listado oficial)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: CL-RM }
                        name: { type: string }
                        communes: { type: array, items: { type: string } }
  /storefront/v1/cart:
    get:
      summary: Carrito actual (del token X-Cart-Token o del cliente autenticado)
      parameters: [{ $ref: "#/components/parameters/CartToken" }]
      security: [{}, { customerToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Cart" }
  /storefront/v1/cart/items:
    post:
      summary: Agrega unidades. Si no hay carrito lo crea y entrega su token una sola vez en `token`
      parameters: [{ $ref: "#/components/parameters/CartToken" }]
      security: [{}, { customerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, quantity]
              properties:
                sku: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        "201": { $ref: "#/components/responses/Cart" }
        "422": { description: Producto no disponible, sin precio o sin stock suficiente }
  /storefront/v1/cart/items/{sku}:
    parameters:
      - { name: sku, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/CartToken" }
    patch:
      summary: Cambia la cantidad (0 = quitar)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 0, maximum: 99 } } }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "404": { description: "cart_not_found" }
    delete:
      summary: Quita el producto del carrito
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "404": { description: "cart_not_found" }
  /storefront/v1/checkout/options:
    get:
      summary: Métodos de despacho para la región, la comuna y el peso del carrito, y medios de pago activos
      parameters:
        - { name: region_code, in: query, schema: { type: string, example: CL-RM } }
        - { name: commune, in: query, description: Necesaria para los métodos con tarifas por zona, schema: { type: string, example: Providencia } }
        - { $ref: "#/components/parameters/CartToken" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      shipping_methods: { type: array, items: { $ref: "#/components/schemas/ShippingOption" } }
                      payment_methods:
                        type: array
                        items: { type: object, properties: { code: { type: string, example: bank_transfer }, name: { type: string }, description: { type: string } } }
                      subtotal: { type: integer }
  /storefront/v1/checkout:
    post:
      summary: Crea el pedido pendiente de pago. Los precios se recalculan en el servidor
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 }, description: Misma clave = mismo pedido (reintentos seguros) }
        - { $ref: "#/components/parameters/CartToken" }
      security: [{}, { customerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, first_name, last_name, phone, shipping_method, payment_method, accepts_terms]
              properties:
                email: { type: string, format: email }
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string }
                shipping_method: { type: string }
                payment_method: { type: string, enum: [bank_transfer] }
                address:
                  type: object
                  description: Obligatoria salvo en retiro en tienda
                  properties:
                    recipient: { type: string }
                    phone: { type: string }
                    street: { type: string }
                    number: { type: string }
                    apartment: { type: [string, "null"] }
                    region_code: { type: string }
                    commune: { type: string, description: Si ya se cargaron las comunas oficiales, debe pertenecer a la región }
                    reference: { type: [string, "null"] }
                document_type: { type: string, enum: [boleta, factura] }
                billing_rut: { type: string, description: Obligatorio con factura }
                billing_name: { type: string }
                billing_activity: { type: string }
                notes: { type: string, maxLength: 500 }
                accepts_terms: { type: boolean }
                expected_total: { type: integer, description: Total que vio el cliente. Si no coincide responde 409 price_changed; nunca se usa para cobrar }
      responses:
        "201":
          description: Pedido creado (200 si la clave de idempotencia ya creó uno)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      number: { type: integer }
                      token: { type: string, description: "Token privado de seguimiento para /orders/{token}" }
                      grand_total: { type: integer }
                      status: { type: string }
                      payment_status: { type: string }
                      payment_method: { type: string }
                      next: { type: string, enum: [pay, instructions], description: "pay: llevar al cliente a la pasarela con POST /orders/{token}/pay. instructions: mostrar los datos de transferencia" }
        "400": { description: "idempotency_key_required" }
        "404": { description: "cart_not_found" }
        "409": { description: "price_changed o cart_changed. Incluye `cart` con el resumen actualizado" }
        "422": { description: "Validación, cart_empty, payment_unavailable, shipping_unavailable o stock_insufficient" }
  /storefront/v1/orders/{token}:
    get:
      summary: Seguimiento con el enlace privado. Sin sesión solo muestra comuna y región, nunca la dirección ni el correo
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Order" } } } } } }
        "404": { description: No existe }
  /storefront/v1/shipments/{token}:
    get:
      summary: Seguimiento público de un despacho con el enlace del correo. Sin nombres, correos, teléfonos ni dirección (solo comuna y región)
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: "#/components/schemas/Shipment" }
                      - type: object
                        properties:
                          order_number: { type: integer }
                          delivery: { type: string, enum: [pickup, delivery] }
                          destination: { type: [object, "null"], properties: { commune: { type: [string, "null"] }, region: { type: [string, "null"] } } }
                          estimated_days: { type: [string, "null"] }
                          pickup_address: { type: [string, "null"] }
        "404": { description: No existe, el enlace no es válido o el despacho fue anulado }
  /storefront/v1/orders/{token}/pay:
    post:
      summary: "Inicia o reintenta el pago con pasarela. Devuelve el formulario que el navegador debe enviar (POST) a la pasarela"
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: "paid: true si el pedido ya estaba pagado (redirect null)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paid: { type: boolean }
                      redirect:
                        type: [object, "null"]
                        properties:
                          url: { type: string, description: URL de la pasarela }
                          method: { type: string, enum: [POST, GET] }
                          fields: { type: object, description: "Campos ocultos del formulario (Webpay: token_ws)" }
        "404": { description: No existe }
        "409": { description: "order_not_payable: el pedido no está pendiente de pago" }
        "422": { description: "payment_unavailable: la pasarela no está activa y verificada" }
        "502": { description: "gateway_error: la pasarela no respondió" }
  /storefront/v1/orders/{token}/cancel:
    post:
      summary: El cliente cancela su pedido mientras está pendiente de pago. Libera el stock y envía un correo
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Pedido actualizado, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Order" } } } } } }
        "404": { description: No existe }
        "422": { description: "El pedido ya está pagado, cancelado o completado (errors.reason con el motivo)" }
  /storefront/v1/orders/{token}/returns:
    post:
      summary: Solicitud de devolución o cambio con el enlace del pedido
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnInput" }
      responses:
        "201":
          description: Solicitud creada. El cliente recibe un correo y la tienda un aviso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      return: { $ref: "#/components/schemas/ReturnRequest" }
                      order: { $ref: "#/components/schemas/Order" }
        "404": { description: No existe }
        "422": { description: "Validación. errors.items explica por qué no se puede (no entregado, plazo vencido, cantidad mayor a la disponible, devoluciones desactivadas)" }
  /storefront/v1/orders/{token}/returns/{uuid}/cancel:
    post:
      summary: El cliente anula su solicitud mientras no envíe el producto (solicitada, en revisión o aprobada)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Pedido actualizado, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Order" } } } } } }
        "404": { description: No existe }
        "422": { description: La solicitud ya no se puede anular }
  /pagos/{gateway}/retorno:
    get:
      summary: "Regreso del cliente desde la pasarela (Webpay: token_ws, TBK_TOKEN o TBK_ORDEN_COMPRA). Confirma con la pasarela desde el servidor y redirige a la tienda. Idempotente"
      parameters: [{ name: gateway, in: path, required: true, schema: { type: string, enum: [webpay_plus] } }]
      responses:
        "303": { description: "A {tienda}/pedido/{token}?pago=aprobado|rechazado|anulado|pendiente, o a {tienda}/pago/resultado?estado=desconocido" }
    post:
      summary: Igual que GET (Webpay vuelve por POST)
      parameters: [{ name: gateway, in: path, required: true, schema: { type: string, enum: [webpay_plus] } }]
      responses:
        "303": { description: Igual que GET }
  /storefront/v1/auth/register:
    post:
      summary: Crea la cuenta, envía la confirmación de correo y devuelve el token (30 días)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password, password_confirmation, accepts_terms]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: Con letras y números }
                password_confirmation: { type: string }
                accepts_terms: { type: boolean }
                marketing_opt_in: { type: boolean }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "422": { description: Validación o correo ya registrado }
  /storefront/v1/auth/login:
    post:
      summary: Ingreso. 5 intentos por correo e IP por minuto. Une el carrito de invitado (X-Cart-Token) a la cuenta
      parameters: [{ $ref: "#/components/parameters/CartToken" }]
      requestBody:
        content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "422": { description: Correo o contraseña incorrectos }
        "429": { description: too_many_attempts }
  /storefront/v1/auth/logout:
    post: { summary: Revoca el token, security: [{ customerToken: [] }], responses: { "200": { description: OK } } }
  /storefront/v1/auth/forgot-password:
    post:
      summary: Envía el enlace de recuperación. Responde lo mismo exista o no la cuenta
      requestBody: { content: { application/json: { schema: { type: object, properties: { email: { type: string } } } } } }
      responses: { "200": { description: OK } }
  /storefront/v1/auth/reset-password:
    post:
      summary: Cambia la contraseña con el token del correo y cierra las sesiones abiertas
      requestBody: { content: { application/json: { schema: { type: object, required: [token, email, password, password_confirmation], properties: { token: { type: string }, email: { type: string }, password: { type: string }, password_confirmation: { type: string } } } } } }
      responses: { "200": { description: OK }, "422": { description: Enlace inválido o vencido } }
  /storefront/v1/auth/verify-email:
    post:
      summary: Confirma el correo (enlace válido 48 horas) y vincula los pedidos de invitado con ese correo
      requestBody: { content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
      responses: { "200": { description: OK }, "422": { description: Enlace inválido o vencido } }
  /storefront/v1/auth/resend-verification:
    post: { summary: Reenvía la confirmación (máximo 3 cada 10 minutos), security: [{ customerToken: [] }], responses: { "200": { description: OK } } }
  /storefront/v1/me:
    get:
      summary: Perfil del cliente
      security: [{ customerToken: [] }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Customer" } } } } } }, "401": { description: No autenticado } }
    patch:
      summary: Actualiza nombre, apellido, teléfono, RUT y preferencia de correos
      security: [{ customerToken: [] }]
      responses: { "200": { description: OK } }
  /storefront/v1/me/password:
    put:
      summary: Cambia la contraseña (pide la actual)
      security: [{ customerToken: [] }]
      responses: { "200": { description: OK }, "422": { description: Contraseña actual incorrecta } }
  /storefront/v1/me/orders:
    get:
      summary: Pedidos del cliente (20 por página)
      security: [{ customerToken: [] }]
      responses: { "200": { description: "data: [{ uuid, number, placed_at, status, status_label, payment_status_label, grand_total }], meta" } }
  /storefront/v1/me/orders/{uuid}:
    get:
      summary: Detalle de un pedido propio, con dirección completa
      security: [{ customerToken: [] }]
      parameters: [{ name: uuid, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Order" } } } } } }, "404": { description: No existe o es de otro cliente } }
  /storefront/v1/me/orders/{uuid}/cancel:
    post:
      summary: Igual que /orders/{token}/cancel, para un pedido propio
      security: [{ customerToken: [] }]
      parameters: [{ name: uuid, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Pedido actualizado }, "404": { description: No existe o es de otro cliente }, "422": { description: No se puede cancelar } }
  /storefront/v1/me/orders/{uuid}/returns:
    post:
      summary: Igual que /orders/{token}/returns, para un pedido propio
      security: [{ customerToken: [] }]
      parameters: [{ name: uuid, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnInput" }
      responses:
        "201":
          description: Solicitud creada. El cliente recibe un correo y la tienda un aviso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      return: { $ref: "#/components/schemas/ReturnRequest" }
                      order: { $ref: "#/components/schemas/Order" }
        "404": { description: No existe }
        "422": { description: "Validación. errors.items explica por qué no se puede (no entregado, plazo vencido, cantidad mayor a la disponible, devoluciones desactivadas)" }
  /storefront/v1/me/orders/{uuid}/returns/{returnUuid}/cancel:
    post:
      summary: Igual que /orders/{token}/returns/{uuid}/cancel, para un pedido propio
      security: [{ customerToken: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: returnUuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { "200": { description: Pedido actualizado }, "404": { description: No existe }, "422": { description: La solicitud ya no se puede anular } }
  /storefront/v1/me/addresses:
    get:
      summary: Direcciones guardadas (la principal primero)
      security: [{ customerToken: [] }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Address" } } } } } } } }
    post:
      summary: Agrega una dirección (máximo 20)
      security: [{ customerToken: [] }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/AddressInput" } } } }
      responses: { "201": { description: Creada } }
  /storefront/v1/me/addresses/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    patch:
      summary: Edita una dirección propia
      security: [{ customerToken: [] }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/AddressInput" } } } }
      responses: { "200": { description: OK }, "404": { description: No existe o es de otro cliente } }
    delete:
      summary: Elimina una dirección propia
      security: [{ customerToken: [] }]
      responses: { "200": { description: OK } }
components:
  securitySchemes:
    customerToken:
      type: http
      scheme: bearer
      description: Token del cliente (Sanctum, 30 días). Lo guarda el servidor de la tienda en una cookie httpOnly
  parameters:
    CartToken:
      name: X-Cart-Token
      in: header
      required: false
      schema: { type: string }
      description: Token del carrito de invitado. Lo guarda el servidor de la tienda en una cookie httpOnly
  responses:
    Cart:
      description: Carrito con totales recalculados
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Cart" }
              token: { type: [string, "null"], description: Solo al crear el carrito }
    Session:
      description: Sesión iniciada
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  token: { type: string }
                  customer: { $ref: "#/components/schemas/Customer" }
  schemas:
    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded, fail] }
        checks:
          type: object
          properties:
            database: { type: string, enum: [ok, fail] }
            cache: { type: string, enum: [ok, fail] }
            scheduler: { type: string, enum: [ok, stale] }
            worker: { type: string, enum: [ok, stale] }
        version: { type: string }
    PublicStore:
      type: object
      required: [name, currency, locale, contact]
      properties:
        name: { type: string }
        tagline: { type: [string, "null"] }
        currency: { type: string, example: CLP }
        locale: { type: string, example: es-CL }
        contact:
          type: object
          properties:
            email: { type: [string, "null"] }
            phone: { type: [string, "null"] }
        announcements: { type: array, items: { type: string }, description: "Mensajes de la barra de anuncios (configurados en el panel, separados por |)" }
        social:
          type: object
          description: Solo las redes configuradas
          properties:
            instagram: { type: string, format: uri }
            facebook: { type: string, format: uri }
            tiktok: { type: string, format: uri }
        theme:
          description: Tema activo (Fase 9)
          oneOf:
            - $ref: "#/components/schemas/PublicTheme"
            - type: "null"
    PublicTheme:
      type: object
      properties:
        code: { type: string, enum: [lapislazuli, minimalista, fashion, streetwear, tecnologia, lujo, hogar] }
        light: { type: object, additionalProperties: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }, description: "Colores del modo claro (bg, surface, fg, accent, field, ink…)" }
        dark: { type: object, additionalProperties: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }, description: Colores del modo oscuro }
        font_display: { type: string, enum: [brand, serif, system] }
        radius_sm: { type: integer, minimum: 0, maximum: 24 }
        radius: { type: integer, minimum: 0, maximum: 32 }
        uppercase_headings: { type: boolean }
    MenuLink:
      type: object
      properties:
        label: { type: string }
        href: { type: string, description: "Ruta de la tienda (/categoria/ropa) o URL https" }
        children: { type: array, items: { $ref: "#/components/schemas/MenuLink" } }
    CmsPage:
      type: object
      properties:
        title: { type: string }
        slug: { type: string }
        type: { type: string, enum: [home, landing, institutional] }
        seo:
          type: object
          properties:
            title: { type: string }
            description: { type: [string, "null"] }
        version: { type: integer }
        blocks: { type: array, items: { $ref: "#/components/schemas/CmsBlock" } }
    CmsBlock:
      type: object
      description: >-
        Bloque ya resuelto para mostrar. type es uno de hero, banner, image_text, rich_text, products, categories,
        brands, marquee, countdown, testimonials, faq, video. Los campos de data de cada tipo están en
        backend/resources/cms/blocks.json; las imágenes llegan como Image, los productos como ProductCard y el
        texto con formato como html seguro (el HTML escrito a mano llega escapado). Los bloques sin contenido
        visible (sin productos, cuenta regresiva vencida) no se envían.
      properties:
        id: { type: string, example: hero-1 }
        type: { type: string }
        data: { type: object }
    Problem:
      type: object
      description: RFC 9457 (application/problem+json)
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: not_found }
        detail: { type: string }
    Image:
      type: object
      description: "path es relativo: la tienda lo sirve en /media/{path}"
      properties:
        path: { type: string }
        alt: { type: string }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
    Price:
      type: object
      description: Montos en CLP sin decimales, IVA incluido
      properties:
        currency: { type: string, example: CLP }
        amount: { type: integer, description: Precio vigente (oferta si está activa) }
        compare_at: { type: [integer, "null"], description: Precio anterior a tachar }
        discount_percent: { type: [integer, "null"] }
        sale_ends_at: { type: [string, "null"], format: date-time }
        varies: { type: boolean, description: "Solo en tarjetas: true si las variantes tienen precios distintos (se muestra 'Desde')" }
    ProductCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        brand: { type: [object, "null"], properties: { name: { type: string }, slug: { type: string } } }
        image: { oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }
        hover_image: { oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }
        price: { oneOf: [{ $ref: "#/components/schemas/Price" }, { type: "null" }] }
        featured: { type: boolean }
        is_new: { type: boolean, description: Publicado en los últimos 30 días }
        swatches: { type: array, items: { type: object, properties: { label: { type: string }, color_hex: { type: string } } }, description: Colores disponibles en variantes activas }
        variant_count: { type: integer }
        in_stock: { type: boolean, description: "false si todas las variantes están agotadas" }
    StockStatus:
      type: object
      description: "Disponibilidad de una variante. La cantidad exacta solo se informa cuando quedan pocas unidades."
      properties:
        availability: { type: string, enum: [in_stock, low_stock, out_of_stock, backorder], description: "backorder = se vende sin stock (por encargo)" }
        quantity: { type: [integer, "null"], description: "Unidades disponibles si availability es low_stock; 0 si está agotado; null en otro caso" }
    ProductDetail:
      allOf:
        - { $ref: "#/components/schemas/ProductCard" }
        - type: object
          properties:
            short_description: { type: [string, "null"] }
            description_html: { type: [string, "null"], description: "HTML saneado: solo p, br, strong, b, em, i, ul, ol, li, h3, h4, blockquote, sin atributos" }
            images: { type: array, items: { $ref: "#/components/schemas/Image" } }
            breadcrumbs: { type: array, items: { type: object, properties: { name: { type: string }, slug: { type: string } } } }
            tax: { type: object, properties: { included: { type: boolean }, label: { type: string } } }
            options:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  name: { type: string }
                  display: { type: string, enum: [swatch, pill, select] }
                  values: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string }, color_hex: { type: [string, "null"] } } } }
            variants:
              type: array
              items:
                type: object
                properties:
                  sku: { type: string }
                  is_default: { type: boolean }
                  options: { type: object, additionalProperties: { type: string } }
                  price: { oneOf: [{ $ref: "#/components/schemas/Price" }, { type: "null" }] }
                  image: { oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }
                  stock: { $ref: "#/components/schemas/StockStatus" }
            specifications: { type: array, items: { type: object, properties: { name: { type: string }, value: { type: string } } } }
            seo: { type: object, properties: { title: { type: string }, description: { type: [string, "null"] }, canonical_url: { type: [string, "null"], description: "URL canónica definida en el panel; null usa la de la ficha" } } }
    ProductList:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ProductCard" } }
        meta:
          type: object
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
        facets:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
              display: { type: string }
              values:
                type: array
                items:
                  type: object
                  properties:
                    value: { type: string }
                    label: { type: string }
                    color_hex: { type: [string, "null"] }
                    count: { type: integer, description: Productos con este valor, ignorando el filtro de su propio atributo }
                    selected: { type: boolean }
    CategoryCard:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        image: { oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }
    CategoryNode:
      allOf:
        - { $ref: "#/components/schemas/CategoryCard" }
        - type: object
          properties:
            children: { type: array, items: { $ref: "#/components/schemas/CategoryNode" } }
    BrandCard:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        logo: { oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              product_slug: { type: string }
              name: { type: string }
              variant_label: { type: [string, "null"] }
              image: { oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }
              quantity: { type: integer }
              unit_price: { type: integer, description: Con IVA }
              compare_at: { type: [integer, "null"] }
              previous_unit_price: { type: [integer, "null"], description: Precio al agregarlo, si cambió }
              line_total: { type: integer }
              tax_amount: { type: integer }
              purchasable: { type: boolean }
              max_quantity: { type: [integer, "null"], description: null = sin límite de stock }
              stock: { type: [object, "null"] }
        count: { type: integer }
        subtotal: { type: integer, description: Solo productos comprables }
        tax_total: { type: integer }
        warnings: { type: array, items: { type: string } }
        currency: { type: string, example: CLP }
    ShippingOption:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [flat, table, pickup] }
        description: { type: [string, "null"] }
        amount: { type: integer, description: Con IVA; 0 si aplica despacho gratis }
        free_over: { type: [integer, "null"] }
        estimated_days: { type: [string, "null"] }
        carrier_code: { type: [string, "null"], enum: [chilexpress, starken, blue_express, null] }
        carrier_name: { type: [string, "null"] }
        pickup_address: { type: [string, "null"] }
        pickup_hours: { type: [string, "null"] }
        pickup_instructions: { type: [string, "null"] }
        zone_name: { type: [string, "null"] }
    Shipment:
      type: object
      properties:
        status: { type: string, enum: [preparing, ready_for_pickup, shipped, in_transit, out_for_delivery, failed_attempt, delivered, picked_up, returned, cancelled] }
        status_label: { type: string }
        carrier: { type: string, description: Courier, Despacho propio o Retiro en tienda }
        tracking_number: { type: [string, "null"] }
        tracking_url: { type: [string, "null"], description: Página de seguimiento del courier }
        follow_token: { type: string, description: "Solo en el pedido: enlace público /seguimiento/{follow_token}" }
        shipped_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        items: { type: array, items: { type: object, properties: { name: { type: string }, variant_label: { type: [string, "null"] }, quantity: { type: integer } } } }
        events:
          type: array
          items: { type: object, properties: { status: { type: string }, label: { type: string }, description: { type: [string, "null"] }, location: { type: [string, "null"] }, at: { type: string, format: date-time } } }
    Order:
      type: object
      properties:
        number: { type: integer }
        uuid: { type: [string, "null"], description: Solo para el dueño con sesión }
        placed_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, processing, completed, cancelled] }
        status_label: { type: string }
        payment_status: { type: string, enum: [pending, paid, expired, cancelled, refunded] }
        payment_status_label: { type: string }
        fulfillment_status: { type: string, enum: [unfulfilled, preparing, partially_shipped, ready_for_pickup, shipped, delivered, picked_up] }
        fulfillment_status_label: { type: string }
        first_name: { type: string }
        email: { type: [string, "null"], description: Solo para el dueño con sesión }
        items: { type: array, description: "Incluye id y returnable_quantity (unidades que aún se pueden devolver)", items: { type: object } }
        subtotal: { type: integer }
        shipping_total: { type: integer }
        tax_total: { type: integer }
        grand_total: { type: integer }
        shipping: { type: object, description: "method, type, estimated_days, pickup_address, address (por token: solo commune y region)" }
        shipments: { type: array, description: Despachos no anulados, items: { $ref: "#/components/schemas/Shipment" } }
        payment:
          type: object
          properties:
            method: { type: string, description: Nombre visible (Webpay, Transferencia bancaria) }
            method_code: { type: [string, "null"], enum: [webpay_plus, bank_transfer, null] }
            status: { type: [string, "null"], enum: [pending, paid, failed, aborted, expired, cancelled, null], description: Estado del último intento }
            status_label: { type: [string, "null"] }
            expires_at: { type: [string, "null"], format: date-time }
            transfer: { type: [object, "null"], description: Datos bancarios mientras el pago por transferencia está pendiente }
            can_pay: { type: boolean, description: Se puede pagar o reintentar con la pasarela }
            failure_reason: { type: [string, "null"] }
            card_last4: { type: [string, "null"], description: Solo los 4 últimos dígitos }
            payment_type: { type: [string, "null"], description: "Débito, Crédito, Prepago, cuotas..." }
            installments: { type: [integer, "null"] }
            authorization_code: { type: [string, "null"] }
            refunded_amount: { type: integer }
        can_cancel: { type: boolean, description: El cliente puede cancelarlo (pendiente de pago) }
        returns: { type: array, description: "Devoluciones y cambios del pedido, la más reciente primero", items: { $ref: "#/components/schemas/ReturnRequest" } }
        return_policy:
          type: object
          properties:
            can_request: { type: boolean }
            blocked_reason: { type: [string, "null"], description: Por qué no se puede pedir ahora }
            deadline: { type: [string, "null"], format: date-time, description: Fecha límite (desde la última entrega) }
            days: { type: integer }
            allow_exchange: { type: boolean }
            policy: { type: [string, "null"] }
            reasons: { type: object, additionalProperties: { type: string }, description: "código → texto (retracto, defective, damaged, wrong_item, size, other)" }
        document_type: { type: string }
        events: { type: array, items: { type: object, properties: { type: { type: string }, label: { type: string }, at: { type: string } } } }
    ReturnInput:
      type: object
      required: [type, reason, items]
      properties:
        type: { type: string, enum: [return, exchange] }
        reason: { type: string, enum: [retracto, defective, damaged, wrong_item, size, other] }
        notes: { type: [string, "null"], maxLength: 2000 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, quantity]
            properties:
              id: { type: integer, description: "id del ítem del pedido (items[].id)" }
              quantity: { type: integer, minimum: 1, description: "Hasta items[].returnable_quantity" }
    ReturnRequest:
      type: object
      description: Vista del cliente. Sin notas internas ni responsable
      properties:
        uuid: { type: string, format: uuid }
        label: { type: string, description: "Número visible, ej. 1001-D1" }
        type: { type: string, enum: [return, exchange] }
        type_label: { type: string }
        reason_label: { type: string }
        status: { type: string, enum: [requested, in_review, approved, rejected, received, processed, closed, cancelled] }
        status_label: { type: string }
        instructions: { type: [string, "null"], description: Solo mientras está aprobada }
        rejection_reason: { type: [string, "null"], description: Solo si se rechazó }
        resolution: { type: [string, "null"], description: Solo resuelta o cerrada }
        refund_amount: { type: [integer, "null"], description: Solo resuelta o cerrada }
        can_cancel: { type: boolean }
        created_at: { type: string, format: date-time }
        items: { type: array, items: { type: object, properties: { name: { type: string }, variant_label: { type: [string, "null"] }, quantity: { type: integer } } } }
    Customer:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        rut: { type: [string, "null"] }
        marketing_opt_in: { type: boolean }
        email_verified: { type: boolean }
    AddressInput:
      type: object
      required: [recipient, phone, street, number, region_code, commune]
      properties:
        label: { type: [string, "null"] }
        recipient: { type: string }
        phone: { type: string }
        street: { type: string }
        number: { type: string }
        apartment: { type: [string, "null"] }
        region_code: { type: string }
        commune: { type: string }
        reference: { type: [string, "null"] }
        is_default: { type: boolean }
    Address:
      allOf:
        - { $ref: "#/components/schemas/AddressInput" }
        - type: object
          properties:
            id: { type: integer }
            region: { type: string }
